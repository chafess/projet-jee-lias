spring.application.name=lias
server.port=8082

# 1. Configuration de la connexion MySQL
spring.datasource.username=root
spring.datasource.password=chaimaa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# AJOUT DE : &allowPublicKeyRetrieval=true (C'est ce qui règle votre erreur)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/lias_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true

# 2. Paramètres Hibernate
spring.jpa.hibernate.ddl-auto=update
# On met false pour accélérer le démarrage (moins de texte dans la console)
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# 3. Paramètres d'upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
upload.path=C:/lias_uploads/

# 4. Désactiver H2
spring.h2.console.enabled=false