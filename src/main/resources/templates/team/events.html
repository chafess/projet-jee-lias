<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Événements Équipe | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        :root { --primary: #0a66c2; --bg: #f3f6f8; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }
        .main-content { margin-left: 280px; padding: 40px; }

        .card-lias { background: white; border-radius: 20px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 25px; }
        .stat-box { border-radius: 20px; background: white; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }

        .member-item { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 10px; border: 1px solid #eee; display: flex; align-items: center; }
        .avatar-circle { width: 45px; height: 45px; background: #eef6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); font-weight: 800; margin-right: 15px; }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='team-events')}"></div>

<main class="main-content">
    <h3 class="font-weight-bold mb-4">Événements de l'équipe</h3>
    <div class="card-lias">
        <div th:each="event : ${allEvents}" class="d-flex align-items-center border-bottom py-3">
            <div class="mr-4 text-center">
                <h4 class="mb-0 font-weight-bold text-primary" th:text="${#temporals.format(event.date, 'dd')}"></h4>
                <small class="text-uppercase" th:text="${#temporals.format(event.date, 'MMM')}"></small>
            </div>
            <!-- Dans team/events.html, ajoutez ceci pour le debug -->
            <div th:if="${allEvents.empty}" class="alert alert-warning">
                Aucun événement trouvé pour l'équipe ID: <span th:text="${user.team != null ? user.team.id : 'Aucune équipe'}"></span>
            </div>
            <div class="flex-grow-1">
                <h6 class="mb-0 font-weight-bold" th:text="${event.title}">Titre</h6>
                <small class="text-muted" th:text="${event.lieu}"></small>
            </div>
            <span class="badge badge-light" th:text="${event.type}">Type</span>
        </div>
    </div>
</main>
</body>
</html>
