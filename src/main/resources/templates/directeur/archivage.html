<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Archivage Documentaire | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f8f9fa; --text: #1c1e21; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg) !important; color: var(--text); }

        /* Layout Fluidité */
        .main-content { margin-left: 280px; padding: 40px; transition: 0.3s; }

        /* Badges de rôle dans le titre */
        .badge-role { font-size: 0.65rem; padding: 4px 12px; border-radius: 6px; font-weight: 800; text-transform: uppercase; margin-left: 15px; vertical-align: middle; }
        .badge-read { background: #f1f3f5; color: #666; }
        .badge-edit { background: #e8f5e9; color: #1a8a3a; }

        /* Filtres */
        .filter-select { background: white; border: 1px solid #e2e8f0; border-radius: 12px; height: 48px; font-weight: 600; padding: 0 20px; width: 280px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }

        /* Tableau style Image */
        .table-container { background: white; border-radius: 20px; border: 1px solid #eef0f2; overflow: hidden; margin-top: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .doc-table thead th { background: #fafbfc; border: none; font-size: 0.75rem; font-weight: 800; color: #888; padding: 20px 25px; text-transform: uppercase; letter-spacing: 0.5px; }
        .doc-table td { vertical-align: middle; padding: 20px 25px; border-top: 1px solid #f8fafc; font-size: 0.9rem; }

        /* Badges de Type de Document */
        .type-pill { padding: 5px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; display: inline-block; }
        .type-financement { background: #e7f3ff; color: #0a66c2; }
        .type-programme { background: #f3f0ff; color: #7950f2; }
        .type-convention { background: #fffcf0; color: #d4af37; }
        .type-attestation { background: #e8f5e9; color: #1a8a3a; }
        .type-pv { background: #f1f3f5; color: #444; }

        /* Boutons Actions */
        .btn-action-view { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 8px 22px; font-weight: 700; color: #475569; font-size: 0.85rem; transition: 0.2s; text-decoration: none !important; }
        .btn-action-view:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-download-icon { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; width: 40px; height: 40px; color: #64748b; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-download-icon:hover { background: #e2e8f0; color: #1e293b; }

        .btn-delete-small { color: #f87171; font-size: 1rem; transition: 0.2s; cursor: pointer; }
        .btn-delete-small:hover { color: #dc2626; }

        /* Header Button */
        .btn-add-doc { background: var(--primary); color: white !important; border-radius: 12px; padding: 10px 25px; font-weight: 700; font-size: 0.9rem; border: none; box-shadow: 0 4px 10px rgba(10, 102, 194, 0.2); }
    </style>
</head>
<body>

<!-- Insertion de la sidebar avec le rôle de l'utilisateur -->
<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='archive')}"></div>

<main class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h3 class="font-weight-bold mb-1">
                Archivage documentaire
                <span th:if="${user.role == 'VICE_DIRECTEUR'}" class="badge-role badge-read">Lecture seule</span>
                <span th:if="${user.role == 'DIRECTEUR'}" class="badge-role badge-edit">Gestion active</span>
            </h3>
            <p class="text-muted small mb-0">Consultez et gérez la mémoire documentaire du laboratoire</p>
        </div>

        <!-- SEUL LE DIRECTEUR PEUT VOIR LE BOUTON AJOUTER -->
        <button th:if="${user.role == 'DIRECTEUR'}" class="btn btn-add-doc shadow-sm" data-toggle="modal" data-target="#uploadDocModal">
            <i class="fas fa-file-upload mr-2"></i> Déposer un document
        </button>
    </header>

    <!-- BARRE DE RECHERCHE / FILTRE -->
    <form th:action="@{/directeur/archivage}" method="get" class="mb-4">
        <select name="type" class="filter-select shadow-sm" onchange="this.form.submit()">
            <option value="Tous types">Tous les types de documents</option>
            <option value="Financement">Demandes de financement</option>
            <option value="Programme">Programmes scientifiques</option>
            <option value="Attestation">Attestations</option>
            <option value="Convention">Conventions partenaires</option>
            <option value="PV">Procès-verbaux</option>
        </select>
    </form>

    <!-- TABLEAU RÉCAPITULATIF -->
    <div class="table-container shadow-sm">
        <table class="table doc-table mb-0">
            <thead>
            <tr>
                <th>Document</th>
                <th>Type</th>
                <th>Année</th>
                <th>Déposé par</th>
                <th class="text-right">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doc : ${documents}">
                <td class="font-weight-bold text-dark" th:text="${doc.title}">Nom du document</td>
                <td>
                    <span th:class="'type-pill type-' + ${#strings.toLowerCase(doc.type)}" th:text="${doc.type}">Type</span>
                </td>
                <td class="font-weight-bold text-muted" th:text="${doc.year}">2024</td>
                <td th:text="${doc.uploader != null ? doc.uploader.firstName + ' ' + doc.uploader.lastName : 'Direction'}">Auteur</td>
                <td class="text-right">
                    <div class="d-inline-flex align-items-center">
                        <a th:href="@{'/uploads/' + ${doc.filePath}}" target="_blank" class="btn-action-view mr-2">
                            <i class="far fa-eye mr-1"></i> Voir
                        </a>
                        <a th:href="@{'/uploads/' + ${doc.filePath}}" download class="btn-download-icon mr-3">
                            <i class="fas fa-download"></i>
                        </a>
                        <form th:if="${user.role == 'DIRECTEUR'}" th:action="@{/directeur/archivage/delete/{id}(id=${doc.id})}" method="post">
                            <button type="submit" class="btn-delete-small border-0 bg-transparent" onclick="return confirm('Confirmer la suppression ?')">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${documents.empty}">
                <td colspan="5" class="text-center py-5 text-muted">
                    <i class="fas fa-folder-open fa-3x mb-3 text-light"></i><br>
                    Aucun document archivé pour le moment.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<!-- MODALE DÉPÔT DE DOCUMENT -->
<div class="modal fade" id="uploadDocModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 24px; padding: 10px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="font-weight-bold">Déposer un document</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form th:action="@{/member/documents/save}" method="post" enctype="multipart/form-data">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">Titre du document</label>
                        <input type="text" name="title" class="form-control border-0 bg-light" style="border-radius: 10px;" required>
                    </div>
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">Type de document</label>
                        <select name="type" class="form-control border-0 bg-light" style="border-radius: 10px;" required>
                            <option value="Financement">Demande de financement</option>
                            <option value="Programme">Programme scientifique</option>
                            <option value="Attestation">Attestation</option>
                            <option value="Convention">Convention</option>
                            <option value="PV">Procès-verbal (PV)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">Fichier PDF</label>
                        <input type="file" name="file" accept=".pdf" class="form-control-file" required>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 font-weight-bold shadow-sm">Confirmer le dépôt</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts placés tout à la fin pour un bon fonctionnement -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
