<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Material Requests</title>
    <!-- 1. CSS Standard -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        :root { --lias-blue: #004a99; --lias-purple: #7c4dff; --lias-bg: #f8f9fa; }
        body { background-color: var(--lias-bg); font-family: 'Segoe UI', sans-serif; }
        .main-content-area { margin-left: 280px; padding: 40px; }

        /* BOUTON VIOLET (+ Add New Equipment) */
        .btn-add-purple {
            background-color: var(--lias-purple); color: white !important;
            border-radius: 12px; padding: 12px 25px; font-weight: 700; border: none;
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3); cursor: pointer; transition: 0.3s;
        }
        .btn-add-purple:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 77, 255, 0.4); }

        /* BOITES DE STATISTIQUES */
        .stat-box { border-radius: 20px; border: none; background: white; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); height: 100%; }
        .stat-number { font-size: 2.2rem; font-weight: 800; color: #1a1a1a; display: block; }
        .stat-label { font-size: 0.7rem; font-weight: 700; color: #aaa; text-transform: uppercase; }

        /* TABLEAU */
        .card-table { border-radius: 25px; border: none; background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
        .table thead th { border: none; color: #bbb; font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase; padding: 20px; }
        .table td { vertical-align: middle; border-top: 1px solid #fcfcfc; padding: 25px 20px; }

        /* POINTS DE COULEUR (Indicateurs d'état) */
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .dot-green { background-color: #2ecc71; box-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
        .dot-yellow { background-color: #f1c40f; box-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }
        .dot-red { background-color: #e74c3c; box-shadow: 0 0 10px rgba(231, 76, 60, 0.4); }

        /* BOUTONS D'ACTION (Bleu et Transparent) */
        .btn-blue-accept {
            background-color: var(--lias-blue);
            color: white !important;
            border-radius: 12px;
            padding: 8px 25px;
            font-weight: 600;
            border: none;
            transition: 0.3s;
        }
        .btn-blue-accept:hover { background-color: #003366; transform: scale(1.05); }

        .btn-transparent-refuse {
            background: transparent;
            color: #aaa;
            border: none;
            font-weight: 600;
            padding: 8px 15px;
            transition: 0.3s;
            cursor: pointer;
        }
        .btn-transparent-refuse:hover { color: #e74c3c; background: rgba(231, 76, 60, 0.05); border-radius: 12px; }
    </style>
</head>
<body>

<!-- 1. Sidebar Unifiée -->
<div th:replace="~{fragments/sidebar ::sidebar(user=${user}, activePage='material-requests')}"></div>

<div class="main-content-area">
    <div class="container-fluid">
        <h2 class="font-weight-bold mb-4">Material Requests</h2>

        <!-- 2. Bouton + Add New Equipment -->
        <button type="button" class="btn btn-add-purple mb-4" data-toggle="modal" data-target="#surveyModal">
            <i class="fas fa-plus mr-2"></i> Add New Equipment
        </button>
        <!--message d;erreur-->
        <!-- Messages de succès ou d'erreur -->
        <div th:if="${message}" class="alert alert-success shadow-sm" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger shadow-sm" th:text="${error}"></div>

        <!-- 3. Stats Row -->
        <div class="row mb-5">
            <div class="col-md-4"><div class="stat-box"><span class="stat-number" th:text="${totalEq}">0</span><span class="stat-label">Total Equipment</span></div></div>
            <div class="col-md-4"><div class="stat-box"><span class="stat-number" th:text="${inStockEq}">0</span><span class="stat-label">In Stock (Available)</span></div></div>
            <div class="col-md-4"><div class="stat-box"><span class="stat-number" th:text="${assignedEq}">0</span><span class="stat-label">Currently Assigned</span></div></div>
        </div>

        <!-- 4. Requests Table -->
        <div class="card card-table p-4">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th>DEMANDEUR (ÉQUITÉ)</th>
                    <th>OBJET DEMANDÉ</th>
                    <th>DISPONIBILITÉ STOCK</th>
                    <th class="text-right">ACTION DÉCISION</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${allRequests}">
                    <!-- ÉQUITÉ -->
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="bg-light rounded-circle mr-3 d-flex align-items-center justify-content-center text-primary font-weight-bold" style="width:40px; height:40px;">
                                <span th:text="${r.member.firstName.substring(0,1).toUpperCase()}">U</span>
                            </div>
                            <div>
                                <strong th:text="|${r.member.firstName} ${r.member.lastName}|"></strong><br>
                                <small th:if="${#lists.isEmpty(r.member.equipments)}">
                                    <span class="dot dot-green"></span> <span class="text-success font-weight-bold">Prioritaire (0 reçu)</span>
                                </small>
                                <small th:if="${not #lists.isEmpty(r.member.equipments)}">
                                    <span class="dot dot-yellow"></span> <span class="text-warning font-weight-bold">Déjà servi (<span th:text="${#lists.size(r.member.equipments)}"></span>)</span>
                                </small>
                            </div>
                        </div>
                    </td>

                    <!-- OBJET -->
                    <td>
                        <span class="font-weight-bold" th:text="${r.itemName}"></span><br>
                        <small class="text-muted" th:text="${r.requestType == 'PURCHASE' ? 'Achat Budget' : 'Location Labo'}"></small>
                    </td>

                    <!-- VÉRIFICATION RÉELLE DU STOCK -->
                    <!-- VÉRIFICATION RÉELLE DU STOCK (Version Robuste) -->
                    <td>
                        <div th:with="availableCount=${#lists.size(inventory.?[name.toLowerCase().trim() == '__${r.itemName.toLowerCase().trim()}__' and user == null])}">

                            <!-- Cas 1 : On trouve au moins un objet avec le même nom qui est libre -->
                            <span th:if="${availableCount > 0}">
            <span class="dot dot-green"></span>
            <span class="text-success small font-weight-bold">Disponible (<span th:text="${availableCount}"></span>)</span>
        </span>

                            <!-- Cas 2 : L'objet n'existe pas ou n'est pas libre -->
                            <span th:if="${availableCount == 0}">
            <span class="dot dot-red"></span>
            <span class="text-danger small font-weight-bold">Rupture de stock</span>
        </span>
                        </div>
                    </td>

                    <!-- ACTIONS -->
                    <td class="text-right">
                        <div class="d-inline-flex align-items-center">
                            <form th:if="${r.status == 'PENDING'}" th:action="@{'/directeur/material-requests/approve/' + ${r.id}}" method="post">
                                <button type="submit" class="btn btn-blue-accept btn-sm mr-2 shadow-sm">Accepter</button>
                            </form>
                            <form th:action="@{'/directeur/material-requests/delete/' + ${r.id}}" method="post">
                                <button type="submit" class="btn btn-transparent-refuse btn-sm" onclick="return confirm('Delete this request?')">
                                    <i class="fas fa-trash-alt"></i> Refuser
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${allRequests.empty}">
                    <td colspan="4" class="text-center py-5 text-muted">No material requests to display.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 5. MODAL (L'identifiant est id="surveyModal") -->
<div class="modal fade" id="surveyModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-weight-bold">Register Equipment</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form th:action="@{/directeur/equipment/save}" th:object="${newEquipment}" method="post">
                <div class="modal-body p-4">
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">MATERIAL NAME</label>
                        <input type="text" th:field="*{name}" class="form-control border-0 bg-light" placeholder="e.g. Laptop, Drone..." required style="height:50px; border-radius:12px;">
                    </div>
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">REFERENCE / SERIAL NUMBER</label>
                        <input type="text" th:field="*{reference}" class="form-control border-0 bg-light" placeholder="LIAS-2025-001" style="height:50px; border-radius:12px;">
                    </div>
                </div>
                <div class="modal-footer border-0 p-4">
                    <button type="submit" class="btn btn-primary btn-block rounded-pill font-weight-bold py-3 shadow">Add to Inventory</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts JQuery/Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
