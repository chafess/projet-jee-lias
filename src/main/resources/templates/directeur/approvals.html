<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Accept Adhesions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<!-- Sidebar active sur 'approvals' -->
<div th:replace="~{fragments/sidebar ::sidebar(user=${user}, activePage='approvals')}"></div>

<div class="main-content-area">
    <div class="container-fluid">
        <h2 class="font-weight-bold mb-4">Pending Adhesion Requests</h2>

        <div class="card border-0 shadow-sm p-4 bg-white" style="border-radius: 20px;">
            <div th:if="${#lists.isEmpty(pendingMembers)}" class="text-center py-5">
                <p class="text-muted">No pending requests.</p>
            </div>

            <table class="table table-hover" th:if="${!#lists.isEmpty(pendingMembers)}">
                <thead>
                <tr class="text-muted small">
                    <th>APPLICANT</th>
                    <th>STATUS</th>
                    <th class="text-right">ACTIONS</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${pendingMembers}">
                    <td>
                        <strong th:text="|${m.firstName} ${m.lastName}|"></strong><br>
                        <small class="text-muted" th:text="${m.email}"></small>
                    </td>
                    <td><span class="badge badge-secondary px-3 py-2" th:text="${m.status}"></span></td>
                    <td class="text-right">
                        <div class="d-inline-flex">
                            <form th:action="@{'/directeur/approve/' + ${m.id}}" method="post" class="mr-2">
                                <button class="btn btn-success btn-sm rounded-pill px-3">Accept</button>
                            </form>
                            <form th:action="@{'/directeur/reject/' + ${m.id}}" method="post">
                                <button class="btn btn-outline-danger btn-sm rounded-circle"><i class="fas fa-trash-alt"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
