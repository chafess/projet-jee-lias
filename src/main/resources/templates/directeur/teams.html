<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Gestion des Équipes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
<!--/*@thymesVar id="allTeams" type="java.util.List<com.fsbm.lias.model.Team>"*/-->
<!--/*@thymesVar id="newTeam" type="com.fsbm.lias.model.Team"*/-->
<!-- On insère la Sidebar -->
<div th:replace="~{fragments/sidebar ::sidebar(activePage='teams')}"></div>

<div class="main-content-area">
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="font-weight-bold">Research Teams</h2>
            <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-toggle="modal" data-target="#teamModal">
                <i class="fas fa-plus mr-2"></i> Create New Team
            </button>
        </div>

        <div class="row">
            <!-- Boucle sur les équipes -->
            <div class="col-md-6 mb-4" th:each="t : ${allTeams}">
                <div class="card border-0 shadow-sm p-4 bg-white rounded-lg">
                    <div class="d-flex justify-content-between">
                        <!-- Utilisation de th:text simple -->
                        <h5 class="font-weight-bold text-primary" th:text="${t.name}"></h5>
                        <span class="badge badge-light text-muted" th:text="${'ID: ' + t.id}"></span>
                    </div>
                    <p class="text-muted small" th:text="${t.researchAxe}"></p>
                    <hr>
                    <h6 class="small font-weight-bold text-uppercase">Membres :</h6>
                    <ul class="list-unstyled mt-2">
                        <!-- Boucle sur les membres de l'équipe -->
                        <li th:each="m : ${t.members}" class="small mb-2 d-flex align-items-center">
                            <i class="fas fa-user-circle text-muted mr-2"></i>
                            <span th:text="${m.firstName + ' ' + m.lastName}"></span>
                        </li>
                        <!-- Vérification si la liste est vide avec la syntaxe standard #lists -->
                        <li th:if="${#lists.isEmpty(t.members)}" class="text-muted small">Aucun membre assigné.</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL POUR CRÉER UNE ÉQUIPE -->
<div class="modal fade" id="teamModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title font-weight-bold">New Research Team</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form th:action="@{/admin/teams/save}" th:object="${newTeam}" method="post">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">Team Name</label>
                        <input type="text" th:field="*{name}" class="form-control border-0 bg-light" style="border-radius: 10px;" required>
                    </div>
                    <div class="form-group">
                        <label class="small font-weight-bold text-muted">Research Axe</label>
                        <input type="text" th:field="*{researchAxe}" class="form-control border-0 bg-light" style="border-radius: 10px;">
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light rounded-pill" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 shadow">Create Team</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
