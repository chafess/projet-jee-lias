<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Supervision Événements</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root { --lias-blue: #004a99; --lias-purple: #7c4dff; --lias-bg: #f8f9fa; }
        body { background-color: var(--lias-bg); font-family: 'Segoe UI', sans-serif; }
        .main-content-area { margin-left: 280px; padding: 40px; }
        .stat-box { border-radius: 20px; background: white; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .btn-add-purple { background-color: var(--lias-purple); color: white !important; border-radius: 12px; padding: 12px 25px; font-weight: 700; border: none; box-shadow: 0 4px 15px rgba(124, 77, 255, 0.3); transition: 0.3s; margin-bottom: 30px; cursor: pointer; }
    </style>
</head>
<body>

<!-- Correction Syntaxe Sidebar -->
<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='events')}"></div>

<!-- Ligne 20 : Fragment pour l'import dans index.html -->
<div class="main-content-area" th:fragment="section-events">
    <div class="container-fluid">
        <h2 class="font-weight-bold mb-4">Events Supervision</h2>

        <button class="btn btn-add-purple" data-toggle="modal" data-target="#eventModal">
            <i class="fas fa-plus mr-2"></i> Create & Assign Event
        </button>

        <div class="row mb-5">
            <div class="col-md-3"><div class="stat-box text-center"><h2 class="font-weight-bold" th:text="${totalEvents}">0</h2><small class="text-muted font-weight-bold">TOTAL</small></div></div>
            <div class="col-md-3"><div class="stat-box text-center"><h2 class="font-weight-bold text-primary" th:text="${countConf}">0</h2><small class="text-muted font-weight-bold">CONFÉRENCES</small></div></div>
            <div class="col-md-3"><div class="stat-box text-center"><h2 class="font-weight-bold text-success" th:text="${countSem}">0</h2><small class="text-muted font-weight-bold">SÉMINAIRES</small></div></div>
            <div class="col-md-3"><div class="stat-box text-center"><h2 class="font-weight-bold text-warning" th:text="${countWork}">0</h2><small class="text-muted font-weight-bold">WORKSHOPS</small></div></div>
        </div>

        <div class="card border-0 shadow-sm p-4 bg-white" style="border-radius: 25px;">
            <table class="table table-hover">
                <thead class="small text-muted">
                <tr>
                    <th>EVENT TITLE</th>
                    <th>TYPE</th>
                    <th>DATE</th>
                    <th>ORGANIZER ASSIGNED</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${allEvents}">
                    <td class="font-weight-bold" th:text="${e.title}"></td>
                    <td><span class="badge badge-light px-3 py-2" th:text="${e.type}"></span></td>
                    <td th:text="${e.date}"></td>
                    <td>
                        <div th:if="${e.organizer != null}" class="d-flex align-items-center">
                            <div class="bg-primary text-white rounded-circle mr-2 d-flex align-items-center justify-content-center" style="width:30px; height:30px; font-size:0.7rem;">
                                <!-- Ligne 54 : Correction sécurité Substring -->
                                <span th:text="${e.organizer.firstName != null ? e.organizer.firstName.substring(0,1) : 'U'}"></span>
                            </div>
                            <span class="small" th:text="|${e.organizer.firstName} ${e.organizer.lastName}|"></span>
                        </div>
                        <span th:if="${e.organizer == null}" class="text-danger small font-weight-bold">🔴 No organizer assigned</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-header border-0 pb-0"><h5 class="modal-title font-weight-bold">New Laboratory Event</h5><button type="button" class="close" data-dismiss="modal">&times;</button></div>

            <!-- Ligne 70 : Correction de l'URL admin -> directeur -->
            <form th:action="@{/directeur/events/save}" th:object="${newEvent}" method="post">
                <div class="modal-body p-4">
                    <div class="form-group"><label class="small font-weight-bold">TITLE</label><input type="text" th:field="*{title}" class="form-control border-0 bg-light" required></div>
                    <div class="form-row">
                        <div class="form-group col-md-6"><label class="small font-weight-bold">TYPE</label>
                            <select th:field="*{type}" class="form-control border-0 bg-light">
                                <option value="Conférence">Conférence</option><option value="Séminaire">Séminaire</option><option value="Workshop">Workshop</option>
                            </select>
                        </div>

                        <div class="form-group col-md-6"><label class="small font-weight-bold">DATE</label><input type="date" th:field="*{date}" class="form-control border-0 bg-light"></div>
                    </div>
                    <!--<div class="form-group"><label class="small font-weight-bold">ASSIGN ORGANIZER</label>
                        <select th:field="*{organizer}" class="form-control border-0 bg-light">
                            <option value="">-- Select a Member --</option>
                            <option th:each="m : ${members}" th:value="${m.id}" th:text="|${m.firstName} ${m.lastName}|"></option>
                        </select>
                    </div>-->
                    <div class="form-group">
                        <label class="small font-weight-bold">ASSIGN ORGANIZER</label>
                        <!-- Ajout de required ici -->
                        <select th:field="*{organizer}" class="form-control border-0 bg-light" required>
                            <option value="">-- Select a Member --</option>
                            <option th:each="m : ${members}" th:value="${m.id}" th:text="|${m.firstName} ${m.lastName}|"></option>
                        </select>
                    </div>
                </div>

                <!-- Champ Lieu -->
                <!--<div class="form-group">
                    <label class="font-weight-bold">Lieu</label>
                    <input type="text" name="lieu" class="form-control" placeholder="Ex: Salle B204, Faculté des Sciences">
                </div>

                 Checkbox Associés
                <div class="form-group form-check">
                    <input type="checkbox" name="ouvertAuxAssocies" value="true" class="form-check-input" id="ouvertCheck">
                    <label class="form-check-label font-weight-bold" for="ouvertCheck">
                        Ouvert aux membres associés
                    </label>
                </div>-->
                <!-- Champ Lieu harmonisé -->
                <div class="form-group">
                    <label class="small font-weight-bold">LIEU</label>
                    <input type="text" th:field="*{lieu}" class="form-control border-0 bg-light" placeholder="Ex: Salle B204, Faculté des Sciences">
                </div>

                <!-- Checkbox Associés harmonisée -->
                <div class="form-group form-check">
                    <input type="checkbox" th:field="*{ouvertAuxAssocies}" class="form-check-input" id="ouvertCheck">
                    <label class="form-check-label small font-weight-bold" for="ouvertCheck">
                        Ouvert aux membres associés
                    </label>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="submit" class="btn btn-primary btn-block rounded-pill font-weight-bold py-3">Publish & Notify Organizer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
