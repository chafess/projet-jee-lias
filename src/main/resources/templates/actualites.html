<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualités | LIAS</title>
    <!-- Les styles sont conservés tels quels -->
    <style>
        .filter-chip { padding: 8px 20px; background: #f1f3f5; border-radius: 20px; font-size: 0.85rem; font-weight: 600; color: #495057; cursor: pointer; transition: 0.2s; }
        .filter-chip.active { background: #212529; color: white; }
        .filter-chip:hover:not(.active) { background: #e9ecef; }
        .news-card { background: white; border-radius: 16px; border: 1px solid #eee; transition: 0.3s; }
        .featured-news { border: 1.5px solid #0a66c2; position: relative; }
        .news-card:hover { transform: translateY(-3px); border-color: #ddd; }
        .news-icon-box { width: 45px; height: 45px; background: #e7f3ff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .news-icon-box-small { width: 35px; height: 35px; background: #f8f9fa; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        .badge-soft-blue { background: #e7f3ff; color: #0a66c2; font-weight: 700; }
        .extra-small { font-size: 0.75rem; }
        .btn-charger-plus { background: #f8f9fa; border: 1px solid #ddd; border-radius: 25px; padding: 10px 30px; font-weight: 600; color: #333; transition: 0.2s; }
        .btn-charger-plus:hover { background: #f1f3f5; border-color: #ccc; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body>

<section id="actualites" th:fragment="section-actualites" class="py-5 bg-white">
    <div class="container" style="max-width: 1000px;">

        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="font-weight-bold mb-1">Actualités</h2>
                <p class="text-muted">Dernières nouvelles et événements du laboratoire</p>
            </div>
            <a href="#" class="text-dark small font-weight-bold">Voir tout <i class="fas fa-arrow-right ml-1"></i></a>
        </div>

        <!-- Filtres (Chips) -->
        <div class="d-flex flex-wrap mb-4" style="gap: 10px;">
            <span class="filter-chip active">Tout</span>
            <span class="filter-chip">Publications</span>
            <span class="filter-chip">Événements</span>
            <span class="filter-chip">Soutenances</span>
        </div>

        <!-- BLOC DYNAMIQUE -->
        <div th:if="${not #lists.isEmpty(allActualites)}">

            <!-- 1. ACTUALITÉ À LA UNE (FEATURED) - Prend le premier élément [0] -->
            <div class="news-card featured-news mb-4 shadow-sm" th:with="f=${allActualites[0]}">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="d-flex">
                            <div class="news-icon-box mr-3">
                                <!-- Icône changeante selon le type -->
                                <i th:class="${f.type == 'Publication' ? 'fas fa-file-alt' : 'fas fa-bullhorn'} + ' text-primary'"></i>
                            </div>
                            <span class="badge badge-soft-blue mt-1">Nouveau</span>
                        </div>
                        <span class="text-muted small" th:text="${#temporals.format(f.dateCreation, 'dd MMMM yyyy')}">15 juin 2025</span>
                    </div>

                    <div class="mt-3">
                        <p class="text-muted small mb-1" th:text="${'Nouvelle ' + f.type}">Nouvelle publication</p>
                        <h4 class="font-weight-bold mb-2" th:text="${f.titre}">Titre</h4>
                        <p class="text-muted mb-3" th:text="${f.auteur.firstName + ' ' + f.auteur.lastName}">Auteur</p>

                        <div class="d-flex justify-content-between align-items-center">
                            <span class="small text-muted"><i class="fas fa-book-open mr-2"></i> Actualité Labo</span>
                            <a href="#" class="text-primary font-weight-bold small">Lire plus <i class="fas fa-arrow-right ml-1"></i></a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. GRILLE DES AUTRES ACTUALITÉS - Boucle à partir de l'index 1 -->
            <div class="row">
                <div class="col-md-6 mb-4" th:each="actu, iter : ${allActualites}" th:if="${iter.index > 0}">
                    <div class="news-card shadow-sm h-100">
                        <div class="card-body p-4">
                            <div class="d-flex align-items-center mb-3">
                                <div class="news-icon-box-small mr-3">
                                    <!-- Logique d'icône pour la grille -->
                                    <i th:class="${actu.type == 'Soutenance' ? 'fas fa-graduation-cap' : (actu.type == 'Événement' ? 'fas fa-desktop' : 'fas fa-info-circle')} + ' text-muted'"></i>
                                </div>
                                <span class="text-muted font-weight-bold small" th:text="${actu.type}">Type</span>
                            </div>
                            <h5 class="font-weight-bold" th:text="${actu.titre}">Titre</h5>
                            <p class="text-muted small mb-4" th:text="${#strings.abbreviate(actu.contenu, 120)}">Contenu...</p>
                            <hr>
                            <div class="d-flex justify-content-between text-muted extra-small">
                                <span><i class="far fa-calendar-alt mr-2"></i> <span th:text="${#temporals.format(actu.dateCreation, 'dd MMMM yyyy')}">Date</span></span>
                                <span><i class="fas fa-map-marker-alt mr-2"></i> Labo LIAS</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- État vide -->
        <div th:if="${#lists.isEmpty(allActualites)}" class="text-center py-5">
            <p class="text-muted">Aucune actualité disponible pour le moment.</p>
        </div>

        <!-- Bouton Charger plus -->
        <div class="text-center mt-4">
            <button class="btn btn-charger-plus">Charger plus d'actualités</button>
        </div>
    </div>
</section>

</body>
</html>
