<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Adhesion Request</title>
    <!-- Modern Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #004085; border: none; border-radius: 8px; padding: 12px; }
        .form-control { border-radius: 8px; }
        .form-label { font-weight: 600; color: #495057; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <h2 class="font-weight-bold">Join LIAS Laboratory</h2>
                    <p class="text-muted">Submit your application to become a member</p>
                </div>

                <form th:action="@{/apply}" method="post" enctype="multipart/form-data" class="needs-validation">

                    <!-- Name Row -->
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="form-label">Prénom</label>
                            <input type="text" class="form-control" name="firstName" placeholder="Mark" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" name="lastName" placeholder="Otto" required>
                        </div>
                    </div>

                    <!-- Email and Status -->
                    <div class="form-row">
                        <div class="form-group col-md-7">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
                        </div>
                        <div class="form-group col-md-5">
                            <label class="form-label">Statut cible</label>
                            <select class="custom-select" name="status" required>
                                <option selected disabled value="">Choose...</option>
                                <option value="DOCTORANT">Doctorant</option>
                                <option value="PERMANENT">Membre permanent</option>
                                <option value="ASSOCIE">Membre associé</option>
                            </select>
                        </div>
                    </div>

                    <!-- Origin Info -->
                    <div class="form-group">
                        <label class="form-label">Établissement / Université d'origine</label>
                        <input type="text" class="form-control" name="origin" placeholder="e.g. Faculté des Sciences Ben M’Sik">
                    </div>

                    <!-- CV Upload -->
                    <div class="form-group">
                        <label class="form-label">(CV)</label>
                        <div class="custom-file">
                            <input type="file" class="custom-file-input" id="cvFile" name="cvFile" required>
                            <label class="custom-file-label" for="cvFile">Choose PDF file...</label>
                        </div>
                        <small class="form-text text-muted">Please upload your CV in PDF format.</small>
                    </div>
                    <!-- Dans src/main/resources/templates/apply.html -->
                    <div class="form-group">
                        <label class="small font-weight-bold">Mot de passe</label>
                        <input type="password" name="password" class="form-control" placeholder="Créez votre mot de passe" required>
                    </div>
                    <!-- Motivation -->
                    <div class="form-group">
                        <label class="form-label">Motivation</label>
                        <textarea class="form-control" name="motivation" rows="4" placeholder="Briefly describe why you want to join LIAS..."></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-block shadow-sm">Submit Adhesion Request</button>
                </form>
            </div>

            <div class="text-center mt-3">
                <a href="/" class="text-muted small">← Back to Homepage</a>
            </div>
        </div>
    </div>
</div>
<!-- Message d'erreur pour les doublons -->
<div th:if="${error}" class="alert alert-danger text-center shadow-sm mb-4">
    <i class="fas fa-exclamation-triangle mr-2"></i> <span th:text="${error}"></span>
</div>
<!-- Script to show file name in the custom-file-input -->
<script>
    document.querySelector('.custom-file-input').addEventListener('change', function(e){
        var fileName = document.getElementById("cvFile").files[0].name;
        var nextSibling = e.target.nextElementSibling;
        nextSibling.innerText = fileName;
    })
</script>

</body>
</html>
