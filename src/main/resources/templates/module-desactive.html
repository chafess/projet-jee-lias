<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Module Indisponible | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0a66c2; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .error-card { background: white; border-radius: 20px; padding: 40px; max-width: 500px; text-align: center; border: 1px solid #ebedf0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
<div class="error-card">
    <div class="text-warning mb-3"><i class="fas fa-tools fa-3x"></i></div>
    <h4 class="font-weight-bold text-dark">Module Indisponible</h4>
    <p class="text-muted small mt-2 mb-4">
        Ce module (<strong th:text="${module}">MODULE</strong>) a été temporairement désactivé par l'administrateur du laboratoire.
    </p>
    <a th:if="${user != null}" th:href="@{/dashboard}" class="btn btn-primary rounded-pill px-4 font-weight-bold">
        Retour au tableau de bord
    </a>
    <a th:if="${user == null}" th:href="@{/}" class="btn btn-outline-primary rounded-pill px-4 font-weight-bold">
        Retour à l'accueil
    </a>
</div>
</body>
</html>
