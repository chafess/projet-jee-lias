<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Connexion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .login-card { width: 400px; border-radius: 25px; border: none; padding: 40px; }
        .form-control { border-radius: 12px; height: 50px; background: #fcfcfc; border: 1px solid #eee; }
        .btn-login { background: #004a99; color: white; border-radius: 12px; font-weight: bold; padding: 12px; border: none; }
    </style>
</head>
<body>
<div class="card login-card shadow-lg">
    <div class="text-center mb-4">
        <h3 class="font-weight-bold" style="color: #004a99;">laboratoire <span style="color: #2ecc71;">IA</span></h3>
        <p class="text-muted">Espace de gestion LIAS</p>
    </div>

    <div th:if="${error}" class="alert alert-danger small text-center" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label class="small font-weight-bold text-muted">ADRESSE EMAIL</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group mb-4">
            <label class="small font-weight-bold text-muted">MOT DE PASSE</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-login btn-block">Se connecter</button>
    </form>
    <div class="text-center mt-4">
        <a href="/" class="small text-muted">Retour à l'accueil</a>
    </div>
</div>
</body>
</html>
