<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Annuaire du laboratoire | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f8f9fa; --text: #1c1e21; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); }

        .main-content { margin-left: 280px; padding: 40px; transition: 0.3s; }

        /* Header Buttons */
        .btn-header { background: white; border: 1.5px solid #ddd; border-radius: 10px; padding: 8px 20px; font-weight: 700; font-size: 0.9rem; color: #333; transition: 0.2s; }
        .btn-header:hover { background: #f8f9fa; border-color: #bbb; }

        /* Filter Section */
        .filter-row { display: flex; gap: 15px; margin-bottom: 25px; }
        .filter-select { background: white; border: 1.5px solid #eee; border-radius: 12px; height: 45px; font-weight: 600; padding: 0 15px; flex-grow: 1; }
        .theme-chip { background: white; border: 1.5px solid #eee; padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: #666; cursor: pointer; }
        .theme-chip.active { background: #e7f3ff; color: var(--primary); border-color: var(--primary); }

        /* GRID SYSTEM */
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

        /* MEMBER CARD */
        .member-card { background: white; border-radius: 20px; border: 1px solid #eef0f2; padding: 25px; transition: 0.3s; position: relative; height: 100%; display: flex; flex-direction: column; }
        .member-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        /* Avatar System */
        .avatar-circle { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; margin-bottom: 15px; }
        .bg-team-isdiac { background: #e7f3ff; color: #0a66c2; }
        .bg-team-sima { background: #e8f5e9; color: #1a8a3a; }
        .bg-team-sdtic { background: #fff3e0; color: #b8860b; }
        .bg-team-ilias { background: #f3f0ff; color: #7950f2; }

        .member-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
        .member-grade { font-size: 0.85rem; color: #666; margin-bottom: 10px; }

        .team-badge { position: absolute; top: 30px; right: 25px; background: #f1f3f5; padding: 3px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; color: #0a66c2; }

        /* Specialty Tags */
        .tags-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
        .tag { background: #f8f9fa; border: 1px solid #eee; padding: 2px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; color: #444; }

        /* Action Footer */
        .card-footer-action { margin-top: auto; border-top: 1px solid #f8f9fa; padding-top: 15px; display: flex; justify-content: space-between; align-items: center; }
        .link-contact { color: var(--primary); font-weight: 700; font-size: 0.85rem; text-decoration: none !important; }
        .role-pill { font-size: 0.65rem; font-weight: 800; padding: 4px 12px; border-radius: 6px; text-transform: uppercase; }
        .role-director { background: #fffcf0; color: #d4af37; border: 1px solid #f3e5ab; }
        .role-leader { background: #f0f7ff; color: #0a66c2; border: 1px solid #d0e1fd; }
        .role-phd { background: #f8f9fa; color: #666; border: 1px solid #eee; }

        /* ADD CARD DOTTED */
        .add-card { border: 2px dashed #ddd; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; min-height: 250px; border-radius: 20px; }
        .add-card:hover { border-color: var(--primary); background: #f0f7ff; }
        .add-card i { font-size: 2rem; color: #ccc; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='members')}"></div>

<main class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-weight-bold mb-1">Annuaire du laboratoire</h3>
            <p class="text-muted small"><span th:text="${totalMembers}">38</span> membres — Permanents, doctorants, associés</p>
        </div>
        <div class="d-flex" th:if="${user.role == 'DIRECTEUR' or user.role == 'ADMINISTRATEUR'}">
            <button class="btn-header mr-2"><i class="fas fa-file-export mr-2"></i> Exporter</button>
            <button class="btn-header" onclick="window.location.href='/apply'"><i class="fas fa-user-plus mr-2"></i> Ajouter</button>
        </div>
    </header>

    <!-- BARRE DE RECHERCHE ET FILTRES -->
    <div class="filter-row">
        <input type="text" class="filter-select w-50" placeholder="🔍 Rechercher un membre...">
        <select class="filter-select">
            <option>Toutes les équipes</option>
            <option th:each="t : ${allTeams}" th:text="${t.name}">Équipe</option>
        </select>
        <select class="filter-select">
            <option>Tous les grades</option>
            <option>Professeur</option>
            <option>Maitre de conf.</option>
            <option>Doctorant</option>
        </select>
    </div>

    <!-- CHIPS DE THÈMES -->
    <div class="d-flex flex-wrap mb-5" style="gap: 10px;">
        <span class="theme-chip active">Tous (<span th:text="${totalMembers}"></span>)</span>
        <span class="theme-chip">IA & Machine Learning</span>
        <span class="theme-chip">Génomique</span>
        <span class="theme-chip">Bioinformatique</span>
        <span class="theme-chip">Big Data</span>
        <span class="theme-chip">Modélisation</span>
    </div>

    <!-- GRILLE DES MEMBRES -->
    <div class="members-grid">

        <!-- CARTE D'AJOUT (Visible seulement par le Directeur/Admin) -->
        <div class="add-card" th:if="${user.role == 'DIRECTEUR' or user.role == 'ADMINISTRATEUR'}" onclick="window.location.href='/apply'">
            <div class="text-center">
                <i class="fas fa-plus-circle mb-2"></i>
                <p class="small font-weight-bold text-muted">Ajouter un membre</p>
            </div>
        </div>

        <!-- BOUCLE DYNAMIQUE SUR LES MEMBRES -->
        <div th:each="m : ${allMembers}" class="member-card shadow-sm">
            <!-- Badge équipe en haut à droite -->
            <div class="team-badge" th:if="${m.team != null}" th:text="${m.team.name}">Eq. A</div>

            <!-- Avatar avec initiales et couleur dynamique -->
            <div th:class="'avatar-circle shadow-sm ' +
                (${m.team != null and m.team.name == 'ISDIAC'} ? 'bg-team-isdiac' :
                (${m.team != null and m.team.name == 'SIMA'} ? 'bg-team-sima' :
                (${m.team != null and m.team.name == 'SDTIC'} ? 'bg-team-sdtic' : 'bg-team-ilias')))"
                 th:text="${m.firstName.substring(0,1).toUpperCase() + m.lastName.substring(0,1).toUpperCase()}">
                AB
            </div>

            <div class="member-name" th:text="${(m.role == 'DIRECTEUR' ? 'Pr. ' : 'Dr. ') + m.firstName + ' ' + m.lastName}">Pr. Ahmed Benali</div>
            <div class="member-grade">
                <span th:text="${m.role == 'DOCTORANT' ? 'Doctorant - ' + m.etablissementOrigine : 'Professeur - ' + m.role}">Grade</span>
            </div>

            <!-- Tags d'intérêt (Splittés par virgule si présents) -->
            <div class="tags-container" th:if="${m.centresInteret != null}">
                <span class="tag" th:each="tag : ${#strings.arraySplit(m.centresInteret, ',')}" th:text="${tag}">IA</span>
            </div>

            <!-- Footer Action -->
            <div class="card-footer-action">
                <a th:href="'mailto:' + ${m.email}" class="link-contact">
                    <i class="far fa-envelope mr-2"></i> Contacter
                </a>
                <span th:class="'role-pill ' +
                    (${m.role == 'DIRECTEUR'} ? 'role-director' :
                    (${m.role == 'CHEF_EQUIPE'} ? 'role-leader' : 'role-phd'))"
                      th:text="${m.role}">
                    Directeur
                </span>
            </div>
        </div>
    </div>
</main>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
