<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LIAS - Actualités</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body { background-color: #f3f2ef; font-family: system-ui, -apple-system, sans-serif; }
        .card { border-radius: 10px; border: 1px solid #e0e0e0; margin-bottom: 20px; }
        .profile-header { background: #a0b4b7; height: 60px; border-radius: 10px 10px 0 0; }
        .profile-img { margin-top: -35px; border: 4px solid white; background: white; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: header}"></div>
<!-- STATISTICS ROW (Section 11/18 Vision) -->
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3" style="border-bottom: 4px solid #0073b1 !important;">
            <h3 class="font-weight-bold text-primary" th:text="${countMembers}">0</h3>
            <small class="text-uppercase font-weight-bold text-muted">Members</small>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3" style="border-bottom: 4px solid #28a745 !important;">
            <h3 class="font-weight-bold text-success" th:text="${countPubs}">0</h3>
            <small class="text-uppercase font-weight-bold text-muted">Publications</small>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3" style="border-bottom: 4px solid #ffc107 !important;">
            <h3 class="font-weight-bold text-warning" th:text="${countEvents}">0</h3>
            <small class="text-uppercase font-weight-bold text-muted">Events</small>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card border-0 shadow-sm text-center p-3" style="border-bottom: 4px solid #6f42c1 !important;">
            <h3 class="font-weight-bold" style="color: #6f42c1;" th:text="${countEquipment}">0</h3>
            <small class="text-uppercase font-weight-bold text-muted">Material Items</small>
        </div>
    </div>
</div>
<div class="container mt-4">
    <div class="row">
        <!-- COLONNE GAUCHE: Profil -->
        <div class="col-md-3">
            <div class="card text-center pb-3 shadow-sm bg-white border-0">
                <div class="profile-header"></div>
                <div class="px-3">
                    <img src="https://ui-avatars.com/api/?name=Director+User&background=0D6EFD&color=fff" class="rounded-circle profile-img" width="72">
                    <h5 class="mt-2 mb-0 font-weight-bold">LIAS Director</h5>
                    <p class="small text-muted">Laboratory Management</p>
                </div>
            </div>
        </div>

        <!-- COLONNE CENTRE: Le Flux (Publications) -->
        <div class="col-md-6">
            <div class="card p-3 mb-3 shadow-sm bg-white border-0">
                <div class="d-flex align-items-center">
                    <img src="https://ui-avatars.com/api/?name=Director+User&background=0D6EFD&color=fff" class="rounded-circle mr-3" width="48">
                    <a href="/publication/new" class="btn btn-outline-secondary btn-block text-left rounded-pill py-2 font-weight-bold" style="background: #f3f2ef; border: 1px solid #ddd; text-decoration: none; color: #666;">
                        Partager une publication scientifique...
                    </a>
                </div>
            </div>

            <div th:each="p : ${allPublications}" class="card shadow-sm bg-white border-0 mb-3">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img th:src="@{'https://ui-avatars.com/api/?name=' + ${p.author.firstName} + '+' + ${p.author.lastName}}" class="rounded-circle mr-2" width="40">
                        <div>
                            <h6 class="mb-0 font-weight-bold" th:text="|${p.author.firstName} ${p.author.lastName}|"></h6>
                            <small class="text-muted" th:text="${p.author.status}"></small>
                        </div>
                    </div>
                    <h5 class="font-weight-bold text-primary" th:text="${p.title}"></h5>
                    <small class="text-muted" th:text="|Publié en ${p.year} (${p.type})|"></small>
                </div>
            </div>
        </div>

        <!-- COLONNE DROITE: Événements -->
        <div class="col-md-3">
            <div class="card p-3 shadow-sm bg-white border-0">
                <h6 class="font-weight-bold text-muted mb-3">Événements du Labo</h6>
                <div th:each="e : ${allEvents}" class="mb-3 border-left pl-2 border-primary">
                    <p class="small font-weight-bold mb-0" th:text="${e.title}"></p>
                    <small class="text-muted" th:text="${e.date}"></small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
