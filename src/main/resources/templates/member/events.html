<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Événements | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f3f6f8; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }
        .main-content { margin-left: 280px; padding: 40px; }

        /* Filtres en pilules comme sur l'image */
        .filter-pill { background: white; border: 1px solid #eee; border-radius: 20px; padding: 8px 20px; color: #64748b; font-weight: 600; font-size: 0.9rem; margin-right: 10px; transition: 0.2s; text-decoration: none !important; }
        .filter-pill.active { background: #dbeafe; color: var(--primary); border-color: #bfdbfe; }

        /* Cartes d'événements */
        .event-item { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid #eee; display: flex; align-items: center; }
        .date-badge { min-width: 65px; height: 65px; background: #f8fafc; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-right: 25px; border: 1px solid #f1f5f9; }
        .date-badge b { font-size: 1.2rem; color: #1e293b; line-height: 1; }
        .date-badge small { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        .btn-status { border-radius: 12px; font-weight: 700; font-size: 0.8rem; padding: 8px 20px; border: none; }
        .btn-inscrit { background: #dcfce7; color: #15803d; }
        .btn-sinscrire { background: #dbeafe; color: #1e40af; }
        .btn-archive { background: transparent; color: #94a3b8; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='events')}"></div>

<main class="main-content">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="font-weight-bold mb-0">Événements</h3>
            <p class="text-muted small" th:text="${participationCount + ' événements auxquels vous participez'}">0 événements</p>
        </div>
        <div class="d-flex">
            <button class="btn btn-light rounded-circle mr-2"><i class="fas fa-search"></i></button>
            <button class="btn btn-light rounded-circle"><i class="fas fa-bell"></i></button>
        </div>
    </header>

    <!-- Barre de filtres dynamiques -->
    <div class="d-flex mb-4">
        <a th:href="@{/member/events(type='Tous')}" class="filter-pill" th:classappend="${currentType == 'Tous' ? 'active' : ''}">Tous</a>
        <a th:href="@{/member/events(type='Conférence')}" class="filter-pill" th:classappend="${currentType == 'Conférence' ? 'active' : ''}">Conférences</a>
        <a th:href="@{/member/events(type='Séminaire')}" class="filter-pill" th:classappend="${currentType == 'Séminaire' ? 'active' : ''}">Séminaires</a>
        <a th:href="@{/member/events(type='Workshop')}" class="filter-pill" th:classappend="${currentType == 'Workshop' ? 'active' : ''}">Workshops</a>
    </div>
<!--fdfdfdfs-->
    <!-- Ajoutez ce bloc au début de votre <main> pour le debug -->
    <div class="alert alert-warning" th:if="${upcomingEvents.empty and archivedEvents.empty}">
        Aucun événement trouvé dans la base de données.
    </div>

    <!-- Votre boucle existante -->
    <div th:each="event : ${upcomingEvents}" class="event-item shadow-sm">
        <p th:text="${event.title}">Titre</p>
    </div>
    <!-- Liste des événements à venir -->
    <div class="event-list">
        <div th:each="event : ${upcomingEvents}" class="event-item shadow-sm">
            <div class="date-badge">
                <small th:text="${#temporals.format(event.date, 'MMM')}">MOIS</small>
                <b th:text="${#temporals.format(event.date, 'dd')}">00</b>
            </div>
            <div class="flex-grow-1">
                <h6 class="mb-1 font-weight-bold" th:text="${event.title}">Titre de l'événement</h6>
                <p class="mb-0 text-muted small">
                    <span th:text="${event.lieu}">Lieu</span> ·
                    <span th:text="${#temporals.format(event.date, 'HH:mm')}">00:00</span> ·
                    <span class="badge badge-light" th:text="${event.type}">Type</span>
                </p>
            </div>

            <!-- Logique dynamique du bouton (Aujourd'hui simulé, sera lié aux inscriptions réelles plus tard) -->
            <!--<button class="btn-status btn-sinscrire">S'inscrire</button>-->
            <!-- Remplacez le bouton simple par ce formulaire -->
            <!--<form th:action="@{'/member/events/register/' + ${event.id}}" method="post">
                <button type="submit" class="btn-status btn-sinscrire">S'inscrire</button>
            </form>-->
            <!-- Dans votre boucle th:each="event : ${upcomingEvents}" -->
            <form th:action="@{'/member/events/register/' + ${event.id}}" method="post">
                <!-- Si le membre est déjà inscrit, on désactive le bouton -->
                <button type="submit"
                        th:classappend="${user.participatingEvents.contains(event)} ? 'btn-inscrit' : 'btn-sinscrire'"
                        class="btn-status"
                        th:disabled="${user.participatingEvents.contains(event)}"
                        th:text="${user.participatingEvents.contains(event)} ? 'Inscrit' : 'S\'inscrire'">
                    S'inscrire
                </button>
            </form>
        </div>

        <!-- Section Archives -->
        <h6 class="text-muted font-weight-bold small text-uppercase mt-5 mb-3">Événements passés</h6>
        <div th:each="event : ${archivedEvents}" class="event-item shadow-sm opacity-75">
            <div class="date-badge">
                <small th:text="${#temporals.format(event.date, 'MMM')}">MOIS</small>
                <b th:text="${#temporals.format(event.date, 'dd')}">00</b>
            </div>
            <div class="flex-grow-1">
                <h6 class="mb-1 font-weight-bold text-muted" th:text="${event.title + ' (édition passée)'}">Titre</h6>
                <p class="mb-0 text-muted small">Terminée · Archivée</p>
            </div>
            <button class="btn-status btn-archive">Voir docs</button>
        </div>
    </div>
</main>

</body>
</html>
