<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Calendrier | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f3f6f8; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }
        .main-content { margin-left: 280px; padding: 40px; }

        /* CORRECTION CSS POUR LE ZOOM 100% */
        .calendar-card { background: white; border-radius: 20px; padding: 30px; border: 1px solid #eee; overflow-x: auto; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; margin-top: 10px; min-width: 800px; }
        .calendar-day-label { text-align: center; font-size: 0.8rem; font-weight: 600; color: #94a3b8; padding-bottom: 10px; text-transform: uppercase; }

        /* Les cases ne sont plus carrées forcées, elles s'adaptent */
        .calendar-day { background: white; border: 1px solid #f1f5f9; border-radius: 12px; min-height: 110px; padding: 10px; transition: 0.2s; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .calendar-day:hover { border-color: var(--primary); background: #f8fafc; }
        .calendar-day.empty { background: transparent; border: none; }
        .day-number { font-weight: 700; color: #334155; font-size: 0.95rem; margin-bottom: 5px; }

        /* Le texte long sera coupé proprement avec "..." pour ne pas casser la case */
        .event-marker { background: #dbeafe; border: 1px solid #bfdbfe; border-radius: 8px; padding: 4px 8px; margin-top: 4px; font-size: 0.7rem; color: #1e40af; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100%; text-align: left; }

        .current-month-indicator { font-weight: 800; font-size: 1.6rem; color: #1e293b; text-transform: capitalize; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='calendar')}"></div>

<main class="main-content">

    <!-- EN-TÊTE AVEC BOUTONS DE NAVIGATION -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="current-month-indicator mb-0" th:text="${#temporals.format(currentMonth, 'MMMM yyyy')}">Octobre 2026</h3>
            <p class="text-muted small mb-0">Événements Scientifiques LIAS</p>
        </div>

        <!-- BOUTONS PRÉCÉDENT / AUJOURD'HUI / SUIVANT -->
        <div class="d-flex align-items-center">
            <a th:href="@{/member/calendar(year=${currentMonth.minusMonths(1).year}, month=${currentMonth.minusMonths(1).monthValue})}" class="btn btn-light shadow-sm border mr-2" title="Mois précédent">
                <i class="fas fa-chevron-left text-muted"></i>
            </a>
            <a th:href="@{/member/calendar}" class="btn btn-light shadow-sm border font-weight-bold text-dark mr-2">
                Aujourd'hui
            </a>
            <a th:href="@{/member/calendar(year=${currentMonth.plusMonths(1).year}, month=${currentMonth.plusMonths(1).monthValue})}" class="btn btn-light shadow-sm border" title="Mois suivant">
                <i class="fas fa-chevron-right text-muted"></i>
            </a>
        </div>
    </div>

    <div class="calendar-card shadow-sm">
        <div class="calendar-grid">
            <!-- En-têtes de colonnes -->
            <div class="calendar-day-label">Lun</div>
            <div class="calendar-day-label">Mar</div>
            <div class="calendar-day-label">Mer</div>
            <div class="calendar-day-label">Jeu</div>
            <div class="calendar-day-label">Ven</div>
            <div class="calendar-day-label">Sam</div>
            <div class="calendar-day-label">Dim</div>

            <!-- Cellules vides pour le début du mois -->
            <div th:each="empty : ${#numbers.sequence(0, emptyCellsBefore - 1)}"
                 th:if="${emptyCellsBefore > 0}" class="calendar-day empty"></div>

            <!-- Jours du mois -->
            <div th:each="day : ${#numbers.sequence(1, daysInMonth)}" class="calendar-day">
                <span class="day-number" th:text="${day}">1</span>

                <!-- On cherche les événements pour ce jour précis -->
                <div th:each="event : ${allEvents}"
                     th:if="${event.date.dayOfMonth == day && event.date.month == currentMonth.month && event.date.year == currentMonth.year}">
                    <div class="event-marker" th:text="${event.title}" th:title="${event.title}">
                        Titre Event
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Section "CE MOIS-CI" - Liste stricte des événements -->
    <div class="mt-5">
        <h6 class="text-muted font-weight-bold small text-uppercase">Événements du mois affiché</h6>
        <div class="list-group shadow-sm" style="border-radius: 12px; overflow: hidden;">
            <div th:each="event : ${allEvents}"
                 th:if="${event.date.month == currentMonth.month && event.date.year == currentMonth.year}"
                 class="list-group-item d-flex align-items-center border-0 mb-1 rounded-0 border-bottom">

                <div class="mr-4 text-center" style="min-width: 50px;">
