<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Discussions Générales | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }
        .main-content { margin-left: 280px; padding: 30px; }
        .chat-container { display: grid; grid-template-columns: 320px 1fr; background: white; border-radius: 20px; border: 1px solid #ebedf0; height: calc(100vh - 120px); overflow: hidden; }
        .threads-sidebar { border-right: 1px solid #f1f3f5; overflow-y: auto; padding: 20px; }
        .thread-item { padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; text-decoration: none !important; color: inherit; display: block; border: 1px solid transparent; }
        .thread-item:hover { background: #f8fafc; }
        .thread-item.active { background: #eef6ff; border-color: #bfdbfe; color: var(--primary); }
        .chat-area { display: flex; flex-direction: column; height: 100%; }
        .chat-messages {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto; /* Permet de scroller les messages */
            max-height: calc(100vh - 280px); /* Hauteur fixe pour ne pas dépasser */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message-bubble { max-width: 70%; padding: 12px 18px; border-radius: 18px; font-size: 0.9rem; }
        .msg-theirs { background: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-mine { background: #0a66c2; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input-area {
             padding: 15px 20px;
             border-top: 1px solid #f1f3f5;
             background: white;
             margin-top: auto; /* Reste toujours collé tout en bas */
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='discussions-generales')}"></div>

<main class="main-content">
    <div class="chat-container shadow-sm">
        <!-- COLONNE GAUCHE : Sujets -->
        <div class="threads-sidebar">
            <button class="btn btn-primary btn-block rounded-pill mb-3 font-weight-bold" data-toggle="modal" data-target="#newSubjectModal">
                <i class="fas fa-plus mr-2"></i> Nouveau sujet
            </button>
            <div th:each="d : ${discussions}">
                <a th:href="@{'/member/discussions-generales?open=' + ${d.id}}"
                   class="thread-item" th:classappend="${openedDiscussion != null and openedDiscussion.id == d.id} ? 'active' : ''">
                    <h6 class="font-weight-bold mb-1" th:text="${d.subject}">Sujet</h6>
                    <small class="text-muted" th:text="${#temporals.format(d.dateCreation, 'dd MMM HH:mm')}">Date</small>
                </a>
            </div>
            <div th:if="${discussions.empty}" class="text-center text-muted small py-4">Aucun sujet de discussion.</div>
        </div>

        <!-- COLONNE DROITE : Messages -->
        <div class="chat-area">
            <div th:if="${openedDiscussion != null}" class="d-flex flex-column h-100">
                <div class="p-3 border-bottom font-weight-bold" th:text="${openedDiscussion.subject}">Titre sujet</div>
                <div class="chat-messages">
                    <div th:each="msg : ${messages}"
                         th:class="${msg.author.id == user.id} ? 'message-bubble msg-mine' : 'message-bubble msg-theirs'">
                        <small class="d-block font-weight-bold mb-1" style="font-size: 0.75rem;"
                               th:text="${msg.author.firstName + ' ' + msg.author.lastName}"></small>
                        <span th:text="${msg.content}">Texte message</span>
                    </div>
                </div>
                <div class="chat-input-area">
                    <form th:action="@{'/member/discussions-generales/' + ${openedDiscussion.id} + '/reply'}" method="post" class="d-flex">
                        <input type="text" name="content" class="form-control rounded-pill mr-2" placeholder="Écrivez votre message..." required autocomplete="off">
                        <button type="submit" class="btn btn-primary rounded-circle"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </div>
            <div th:if="${openedDiscussion == null}" class="d-flex align-items-center justify-content-center h-100 text-muted">
                Sélectionnez un sujet à gauche pour voir les échanges.
            </div>
        </div>
    </div>
</main>

<!-- Modal Nouveau Sujet -->
<div class="modal fade" id="newSubjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 p-3" style="border-radius:20px;">
            <div class="modal-header border-0 pb-0"><h5 class="font-weight-bold">Nouveau sujet de discussion</h5></div>
            <form th:action="@{/member/discussions-generales/new}" method="post">
                <div class="modal-body">
                    <label class="small font-weight-bold text-muted">Titre du sujet</label>
                    <input type="text" name="subject" class="form-control rounded-lg mb-3" required>
                    <label class="small font-weight-bold text-muted">Premier message</label>
                    <textarea name="firstMessage" class="form-control rounded-lg" rows="4" required></textarea>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary btn-block rounded-pill">Publier</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
