<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Documents | LIAS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a66c2; --bg: #f3f6f8; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); }
        .main-content { margin-left: 280px; padding: 40px; }

        .doc-category-card { background: white; border-radius: 15px; padding: 20px; text-align: center; border: 1px solid #eee; transition: 0.3s; cursor: pointer; height: 100%; }
        .doc-category-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        .doc-category-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; opacity: 0.8; }
        .doc-category-card.active { background: #eaf4ff; border-color: var(--primary); }

        .doc-item { background: white; border-radius: 12px; padding: 15px 20px; margin-bottom: 10px; border: 1px solid #eee; display: flex; align-items: center; }
        .pdf-icon { color: #dc3545; font-size: 1.5rem; margin-right: 20px; }
        .download-btn { color: #64748b; font-size: 1.2rem; transition: 0.2s; }
        .download-btn:hover { color: var(--primary); }

        .search-wrapper { position: relative; margin-bottom: 30px; }
        .search-wrapper input { border-radius: 10px; padding-left: 15px; height: 45px; border: 1px solid #ddd; }

        .badge-read-only { background: #e2eefc; color: #0a66c2; font-weight: 600; border-radius: 8px; padding: 5px 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(user=${user}, activePage='documents')}"></div>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h3 class="font-weight-bold mb-1">Documents</h3>
            <p class="text-muted small" th:text="${newDocsCount + ' nouveaux documents depuis votre dernière connexion'}">5 nouveaux documents</p>
        </div>
        <span class="badge-read-only"><i class="far fa-eye mr-2"></i> Lecture seule</span>
    </div>

    <!-- Barre de recherche -->
    <div class="search-wrapper">
        <input type="text" class="form-control shadow-sm" placeholder="Rechercher un document...">
    </div>

    <!-- Catégories (Grid matching image) -->
    <!--<div class="row mb-5">
        <div class="col-md-3">
            <div class="doc-category-card active shadow-sm">
                <i class="fas fa-wallet"></i>
                <h6 class="mb-0 font-weight-bold">Financement</h6>
            </div>
        </div>
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-file-invoice"></i>
                <h6 class="mb-0 font-weight-bold">Programmes</h6>
            </div>
        </div>
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-certificate"></i>
                <h6 class="mb-0 font-weight-bold">Attestations</h6>
            </div>
        </div>
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-chart-line"></i>
                <h6 class="mb-0 font-weight-bold">Rapports</h6>
            </div>
        </div>
    </div>-->
    <!-- Catégories (Grid matching image) -->
    <div class="row mb-5">
        <!-- Financement : Condition th:if="${user.role != 'MEMBRE_ASSOCIE'}" -->
        <!--<div class="col-md-3" th:if="${user.role != 'MEMBRE_ASSOCIE'}">
            <div class="doc-category-card active shadow-sm">
                <i class="fas fa-wallet"></i>
                <h6 class="mb-0 font-weight-bold">Financement</h6>
            </div>
        </div>-->
        <!-- Condition modifiée pour exclure aussi le CHEF_EQUIPE -->
        <div class="col-md-3" th:if="${user.role != 'MEMBRE_ASSOCIE' and user.role != 'CHEF_EQUIPE'}">
            <div class="doc-category-card active shadow-sm">
                <i class="fas fa-wallet"></i>
                <h6 class="mb-0 font-weight-bold">Financement</h6>
            </div>
        </div>

        <!-- Programmes -->
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-file-invoice"></i>
                <h6 class="mb-0 font-weight-bold">Programmes</h6>
            </div>
        </div>

        <!-- Attestations -->
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-certificate"></i>
                <h6 class="mb-0 font-weight-bold">Attestations</h6>
            </div>
        </div>

        <!-- Rapports -->
        <div class="col-md-3">
            <div class="doc-category-card shadow-sm">
                <i class="fas fa-chart-line"></i>
                <h6 class="mb-0 font-weight-bold">Rapports</h6>
            </div>
        </div>
    </div>

    <h6 class="text-muted font-weight-bold mb-3 small text-uppercase">Récemment ajoutés</h6>

    <!-- Liste des documents -->
    <div class="documents-list">
        <!-- Début de la boucle dynamique -->
        <div th:each="doc : ${documents}" class="doc-item shadow-sm">
            <i class="fas fa-file-pdf pdf-icon"></i>
            <div class="flex-grow-1">
                <h6 class="mb-0 font-weight-bold" th:text="${doc.title}">Titre du document</h6>
                <small class="text-muted" th:text="${doc.type + ' · ajouté en ' + doc.year}">Type</small>
            </div>

            <!-- Lien dynamique vers la méthode download du Controller -->
            <a th:href="@{'/member/documents/download/' + ${doc.id}}" class="download-btn">
                <i class="fas fa-download"></i>
            </a>
        </div>
        <!-- Fin de la boucle -->

        <div th:if="${documents.empty}" class="text-center py-5 text-muted">
            <i class="fas fa-folder-open fa-3x mb-3 opacity-25"></i>
            <p>Aucun document disponible pour votre équipe.</p>
        </div>
    </div>
</main>

</body>
</html>
